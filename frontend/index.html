<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Personal Knowledge Assistant</title>
	</head>
	<body>
		<h1>Personal Knowledge Assistant</h1>

		<!-- Ask Question Section -->
		<input
			type="text"
			id="question"
			placeholder="Ask a question about your notes"
		/>

		<select id="course">
			<option value="">All courses</option>
		</select>

		<button id="askButton">Ask</button>

		<!-- Chats Section -->
		<button id="newChatButton">New Chat</button>
        <div id="chatList"></div>
		<div id="chat"></div>

		<div id="answer"></div>
		<div id="sources"></div>

		<hr />

		<!-- Upload Notes Section -->
		<h2>Upload Notes</h2>

		<input type="file" id="noteFile" />

		<select id="uploadCourse">
			<option value="">Select course</option>
			<option value="__new__">+ Add new course</option>
		</select>

		<input
			type="text"
			id="newCourse"
			placeholder="Enter new course name"
			style="display: none"
		/>

		<button id="uploadButton">Upload</button>

		<div id="uploadStatus"></div>

		<hr />

		<!-- Knowledge Base Section -->
		<h2>Knowledge Base</h2>

		<button id="refreshDocuments">Refresh Documents</button>

		<div id="documentsList"></div>

		<script>
            async function readAnswerStream(response, onEvent) {
                if (!response.body) throw new Error("Streaming is unavailable");
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let completed = false;
                try {
                    while (true) {
                        const {value, done} = await reader.read();
                        buffer += done ? decoder.decode() : decoder.decode(value, {stream: true});
                        let newline;
                        while ((newline = buffer.indexOf("\n")) >= 0) {
                            const line = buffer.slice(0, newline);
                            buffer = buffer.slice(newline + 1);
                            if (!line.trim()) continue;
                            const event = JSON.parse(line);
                            if (completed) throw new Error("Unexpected event after completion");
                            if (event.type === "error") throw new Error(event.message);
                            onEvent(event);
                            if (event.type === "done") completed = true;
                        }
                        if (done) break;
                    }
                    if (buffer.trim() || !completed) throw new Error("The answer stream ended unexpectedly");
                } finally {
                    try { await reader.cancel(); } catch (_) {}
                    reader.releaseLock();
                }
            }

            function sourceLabel(source) {
                return source.page && source.page !== "unknown" ? `${source.file} - page ${source.page}` : source.file;
            }

            function previewLink(file, page, label = "Preview") {
                const link = document.createElement("a");
                const pageNumber = Number(page);
                const fragment = /\.pdf$/i.test(file) && Number.isInteger(pageNumber) && pageNumber > 0 ? `#page=${pageNumber}` : "";
                link.href = `http://127.0.0.1:8000/documents/${encodeURIComponent(file)}/preview${fragment}`;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.innerText = label;
                return link;
            }

			let currentChatId = null;
            let busy = false;
            function setBusy(value) {
                busy = value;
                for (const id of ["askButton", "newChatButton", "course"]) {
                    document.getElementById(id).disabled = value;
                }
                for (const item of document.getElementById("chatList").children) item.disabled = value;
            }
            function renderHistory() {
                document.getElementById("chat").innerHTML = "";
                for (const message of conversationHistory) {
                    addMessage(message.role === "user" ? "You" : "Assistant", message.content);
                }
            }
            document.getElementById("newChatButton").addEventListener("click", () => {
                if (busy) return;
                currentChatId = null;
                conversationHistory.length = 0;
                renderHistory();
                document.getElementById("answer").innerText = "";
                document.getElementById("sources").innerHTML = "";
                document.getElementById("question").value = "";
            });

			// History of messages in the chat section
			const conversationHistory = [];

			<!-- Ask Button & Query Submission -->
			// Handle query submission
			const button = document.getElementById("askButton");
			button.addEventListener("click", async () => {
				if (busy) return;
                const question = document.getElementById("question").value.trim();
				const course = document.getElementById("course").value;

				// Validate the question before sending it to the API
				if (!question.trim()) {
					document.getElementById("answer").innerText =
						"Please enter a question.";
					return;
				}

				const historyForRequest = [...conversationHistory];

				addMessage("You", question);
				setBusy(true);

				document.getElementById("answer").innerText = "Thinking...";
				document.getElementById("sources").innerHTML = "";

				try {
                    if (currentChatId === null) {
                        await createChat(question, course);
                        // A list refresh failure must not abort a successfully created chat.
                        await loadChats().catch(() => {});
                    }
					const response = await fetch("http://127.0.0.1:8000/ask/stream", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							question,
							course: course || null,
							history: historyForRequest,
							chat_id: currentChatId,
						}),
					});

					if (!response.ok) {
						throw new Error("API request failed");
					}
					let data;
                    let assistantMessage = null;
                    let streamedAnswer = "";
                    await readAnswerStream(response, event => {
                        if (event.type === "status") {
                            document.getElementById("answer").innerText = event.message;
                        } else if (event.type === "delta") {
                            if (!assistantMessage) assistantMessage = addMessage("Assistant", "");
                            streamedAnswer += event.text;
                            assistantMessage.innerText = `Assistant: ${streamedAnswer}`;
                            document.getElementById("answer").innerText = "Answering...";
                        } else if (event.type === "done") {
                            data = event;
                        }
                    });
                    if (!assistantMessage) assistantMessage = addMessage("Assistant", data.answer);
                    assistantMessage.innerText = `Assistant: ${data.answer}`;

					// Display the answer and sources from the API response
					conversationHistory.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
                    document.getElementById("answer").innerText = "";
                    document.getElementById("question").value = "";
					const selectedCourse =
						document.getElementById("course").value || "All courses";
					const seenSources = new Set();
                    const sources = data.sources.filter(source => {
                        const key = sourceLabel(source);
                        if (seenSources.has(key)) return false;
                        seenSources.add(key);
                        return true;
                    });
                    if (sources.length > 0) {
						const sourceText = sources
							.map(sourceLabel)
							.join(", ");
						addMessage("Sources", sourceText);
					}
					const sourcesDiv = document.getElementById("sources");
					sourcesDiv.innerHTML = "";

					const courseLabel = document.createElement("p");
					courseLabel.innerText = `Search scope: ${selectedCourse}`;
					sourcesDiv.appendChild(courseLabel);

					for (const source of sources) {
						const sourceElement = document.createElement("p");
						const label = sourceLabel(source);
                        if (source.file) sourceElement.appendChild(previewLink(source.file, source.page, label));
						sourcesDiv.appendChild(sourceElement);
					}
				} catch (error) {
					renderHistory();
                    // Reload SQLite after an uncertain network failure before allowing a retry.
                    if (currentChatId !== null) {
                        try {
                            const response = await fetch(`http://127.0.0.1:8000/chats/${currentChatId}/messages`);
                            if (!response.ok) throw new Error("Reload failed");
                            const data = await response.json();
                            conversationHistory.splice(0, conversationHistory.length, ...data.messages.map(({role, content}) => ({role, content})));
                            renderHistory();
                        } catch (_) {}
                    }
                    document.getElementById("answer").innerText = "Could not complete the request. Check the saved chat before retrying.";
                } finally {
                    setBusy(false);
				}
			});

			// Handle upload course selection and new course input visibility
			const uploadCourse = document.getElementById("uploadCourse");
			const newCourseInput = document.getElementById("newCourse");

			uploadCourse.addEventListener("change", () => {
				if (uploadCourse.value === "__new__") {
					newCourseInput.style.display = "block";
				} else {
					newCourseInput.style.display = "none";
				}
			});

			// Handle note upload
			const uploadButton = document.getElementById("uploadButton");
			uploadButton.addEventListener("click", async () => {
				const fileInput = document.getElementById("noteFile");
				let course = uploadCourse.value;

				if (course === "__new__") {
					course = newCourseInput.value.trim();
				}

				const status = document.getElementById("uploadStatus");

				const file = fileInput.files[0];

				if (!file) {
					status.innerText = "Please choose a file.";
					return;
				}

				if (!course) {
					status.innerText = "Please enter a course name.";
					return;
				}

				const formData = new FormData();
				formData.append("file", file);
				formData.append("course", course);

				status.innerText = "Uploading and processing...";

				try {
					const response = await fetch("http://127.0.0.1:8000/upload", {
						method: "POST",
						body: formData,
					});

					if (!response.ok) {
						throw new Error("Upload failed");
					}

					const data = await response.json();

					status.innerText = `Uploaded ${data.filename} and stored ${data.chunks_stored} chunks.`;
					await loadCourses();
                    await loadDocuments();
				} catch (error) {
					status.innerText = "Something went wrong while uploading the note.";
				}
			});

			async function loadCourses() {
				const response = await fetch("http://127.0.0.1:8000/courses");
				const data = await response.json();

				const askCourse = document.getElementById("course");
                const selectedCourse = askCourse.value;
				const uploadCourse = document.getElementById("uploadCourse");

				askCourse.innerHTML = '<option value="">All courses</option>';

				uploadCourse.innerHTML = `
				<option value="">Select courses</option>
				<option value="__new__">+ Add new courses</option>`;

				for (const course of data.courses) {
					const askOption = document.createElement("option");
					askOption.value = course;
					askOption.innerText = course;
					askCourse.appendChild(askOption);

					const uploadOption = document.createElement("option");
					uploadOption.value = course;
					uploadOption.innerText = course;
					uploadCourse.appendChild(uploadOption);
				}
                if (Array.from(askCourse.options).some(option => option.value === selectedCourse)) askCourse.value = selectedCourse;
			}

			async function loadDocuments() {
				const response = await fetch("http://127.0.0.1:8000/documents");
				const data = await response.json();

				const documentsList = document.getElementById("documentsList");
				documentsList.innerHTML = "";

				for (const doc of data.documents) {
					const item = document.createElement("div");

					const label = document.createElement("span");
					label.innerText = `${doc.file} - ${doc.course}`;

					const deleteButton = document.createElement("button");
					deleteButton.innerText = "Delete";
					deleteButton.addEventListener("click", async () => {
						const confirmed = confirm(`Delete ${doc.file}?`);

						if (!confirmed) return;

						const response = await fetch(
							`http://127.0.0.1:8000/documents/${encodeURIComponent(doc.file)}`,
							{
								method: "DELETE",
							},
						);

						if (!response.ok) {
							alert("Failed to delete the document.");
							return;
						}
						await loadDocuments();
						await loadCourses();
					});

					item.appendChild(label);
                    if (/\.(pdf|txt)$/i.test(doc.file)) {
                        item.appendChild(document.createTextNode(" "));
                        item.appendChild(previewLink(doc.file));
                        item.appendChild(document.createTextNode(" "));
                    }
					item.appendChild(deleteButton);

					documentsList.appendChild(item);
				}
			}

			async function createChat(title, course) {
				const response = await fetch("http://127.0.0.1:8000/chats", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify({
						title: title,
						course: course || null,
					}),
				});

				if (!response.ok) {
					throw new Error("Could not create chat");
				}

				const data = await response.json();

				currentChatId = data.id;

				return data;
			}

			async function loadChats() {
				const response = await fetch("http://127.0.0.1:8000/chats");
				if (!response.ok) throw new Error("Could not load chats");
                const data = await response.json();

				const chatList = document.getElementById("chatList");
				chatList.innerHTML = "";

				for (const chat of data.chats) {
					const button = document.createElement("button");

					button.innerText = chat.title;

                    button.disabled = busy;
                    button.addEventListener("click", async () => {
                        if (busy) return;
                        setBusy(true);
                        try {
                            const response = await fetch(`http://127.0.0.1:8000/chats/${chat.id}/messages`);
                            if (!response.ok) throw new Error("Could not load chat");
                            const data = await response.json();
                            currentChatId = chat.id;
                            conversationHistory.splice(0, conversationHistory.length, ...data.messages.map(({role, content}) => ({role, content})));
                            const courseSelect = document.getElementById("course");
                            if (chat.course && !Array.from(courseSelect.options).some(option => option.value === chat.course)) {
                                const option = document.createElement("option");
                                option.value = chat.course;
                                option.innerText = chat.course;
                                courseSelect.appendChild(option);
                            }
                            courseSelect.value = chat.course || "";
                            renderHistory();
                            document.getElementById("sources").innerHTML = "";
                            document.getElementById("answer").innerText = "";
                        } catch (error) {
                            document.getElementById("answer").innerText = "Could not load chat. Your current conversation is still selected.";
                        } finally {
                            setBusy(false);
                        }
                    });

					chatList.appendChild(button);
                    let renameControl, deleteControl;
                    for (const action of ["Rename", "Delete"]) {
                        const control = document.createElement("button");
                        control.innerText = action;
                        control.disabled = busy;
                        control.addEventListener("click", async () => {
                            if (busy) return;
                            let title;
                            if (action === "Rename") {
                                title = prompt("New chat title:", chat.title);
                                if (title === null) return;
                                title = title.trim();
                                if (!title) {
                                    document.getElementById("answer").innerText = "Please enter a chat title.";
                                    return;
                                }
                            } else if (!confirm(`Delete "${chat.title}" and all its messages? This cannot be undone.`)) {
                                return;
                            }
                            setBusy(true);
                            try {
                                const response = await fetch(`http://127.0.0.1:8000/chats/${chat.id}`, {
                                    method: action === "Rename" ? "PATCH" : "DELETE",
                                    ...(action === "Rename" ? {
                                        headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({title}),
                                    } : {}),
                                });
                                if (!response.ok) throw new Error("Chat update failed");
                                if (action === "Rename") {
                                    chat.title = title;
                                    button.innerText = title;
                                } else {
                                    // Remove the confirmed deletion even if refreshing the list fails.
                                    button.remove();
                                    renameControl.remove();
                                    deleteControl.remove();
                                    if (currentChatId === chat.id) {
                                        currentChatId = null;
                                        conversationHistory.length = 0;
                                        renderHistory();
                                        document.getElementById("question").value = "";
                                        document.getElementById("sources").innerHTML = "";
                                    }
                                }
                                document.getElementById("answer").innerText = action === "Rename" ? "Chat renamed." : "Chat deleted.";
                                try { await loadChats(); }
                                catch (_) { document.getElementById("answer").innerText += " Could not refresh the chat list. Refresh the page to reload it."; }
                            } catch (error) {
                                document.getElementById("answer").innerText = `Could not ${action.toLowerCase()} the chat. Refresh the chat list before retrying.`;
                            } finally {
                                setBusy(false);
                            }
                        });
                        chatList.appendChild(control);
                        if (action === "Rename") renameControl = control;
                        else deleteControl = control;
                    }

				}
			}
			document
				.getElementById("refreshDocuments")
				.addEventListener("click", loadDocuments);

			function addMessage(role, text) {
				const chat = document.getElementById("chat");

				const message = document.createElement("div");
				message.innerText = `${role}: ${text}`;

				chat.appendChild(message);
                return message;
			}

			Promise.allSettled([loadCourses(), loadDocuments(), loadChats()]).then(results => {
                if (results.some(result => result.status === "rejected")) document.getElementById("answer").innerText = "Some data could not load. Check the backend and refresh.";
            });
		</script>
	</body>
</html>
